<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mellow Labs Financials</title>
  <link rel="stylesheet" href="/css/style.css" />
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.6/dist/chart.umd.min.js"></script>
  <!-- Flatpickr date picker -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
  <!-- Restore the saved sidebar state before first paint, so a collapsed
       sidebar never flashes open on load. -->
  <script>
    (function () {
      try {
        var v = localStorage.getItem("nav-collapsed");
        var collapsed = v === null ? window.innerWidth < 1200 : v === "1";
        if (collapsed) document.documentElement.classList.add("nav-collapsed");
      } catch (e) {}
    })();
  </script>
</head>
<body>

<!-- ─── Sidebar ─────────────────────────────────────────────────────────── -->
<nav class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <div class="sidebar-logo">
      <span class="logo-icon">◈</span>
      <span class="logo-text">Mellow Labs</span>
    </div>
    <div class="sidebar-sub">Financials</div>
    <button class="sidebar-toggle" id="sidebar-toggle"
            aria-label="Collapse menu" aria-expanded="true" data-tip="Expand menu">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor"
           stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M15 18 9 12l6-6" />
      </svg>
    </button>
  </div>

  <div class="sidebar-scroll">
    <div class="sidebar-section">
      <div class="sidebar-label">SUMMARIES</div>
      <a class="nav-item" href="#/yearly"  data-page="yearly" data-tip="Financial Year">
        <span class="nav-icon">📊</span><span class="nav-label">Financial Year</span>
      </a>
      <a class="nav-item" href="#/monthly" data-page="monthly" data-tip="Monthly">
        <span class="nav-icon">📅</span><span class="nav-label">Monthly</span>
      </a>
    </div>

    <div class="sidebar-section">
      <div class="sidebar-label">INCOME</div>
      <a class="nav-item" href="#/sheet/youtube_adsense"  data-page="sheet/youtube_adsense" data-tip="YouTube AdSense">
        <span class="nav-icon income-dot" data-abbr="YT">▸</span><span class="nav-label">YouTube AdSense</span>
      </a>
      <a class="nav-item" href="#/sheet/patreon"         data-page="sheet/patreon" data-tip="Patreon">
        <span class="nav-icon income-dot" data-abbr="PA">▸</span><span class="nav-label">Patreon</span>
      </a>
      <a class="nav-item" href="#/sheet/sponsorships"    data-page="sheet/sponsorships" data-tip="Sponsorships">
        <span class="nav-icon income-dot" data-abbr="SP">▸</span><span class="nav-label">Sponsorships</span>
      </a>
      <a class="nav-item" href="#/sheet/other_income"    data-page="sheet/other_income" data-tip="Other Income">
        <span class="nav-icon income-dot" data-abbr="OI">▸</span><span class="nav-label">Other Income</span>
      </a>
    </div>

    <div class="sidebar-section">
      <div class="sidebar-label">EXPENSES</div>
      <a class="nav-item" href="#/sheet/amazon"          data-page="sheet/amazon" data-tip="Amazon">
        <span class="nav-icon expense-dot" data-abbr="AM">▸</span><span class="nav-label">Amazon</span>
      </a>
      <a class="nav-item" href="#/sheet/ebay"            data-page="sheet/ebay" data-tip="eBay">
        <span class="nav-icon expense-dot" data-abbr="EB">▸</span><span class="nav-label">eBay</span>
      </a>
      <a class="nav-item" href="#/sheet/aliexpress"      data-page="sheet/aliexpress" data-tip="AliExpress">
        <span class="nav-icon expense-dot" data-abbr="AE">▸</span><span class="nav-label">AliExpress</span>
      </a>
      <a class="nav-item" href="#/sheet/other_expenses"  data-page="sheet/other_expenses" data-tip="Other Expenses">
        <span class="nav-icon expense-dot" data-abbr="OE">▸</span><span class="nav-label">Other Expenses</span>
      </a>
    </div>

    <div class="sidebar-section">
      <div class="sidebar-label">TOOLS</div>
      <a class="nav-item" href="#/sponsor-tracker" data-page="sponsor-tracker" data-tip="Sponsor Tracker">
        <span class="nav-icon">🎬</span><span class="nav-label">Sponsor Tracker</span>
      </a>
      <a class="nav-item" href="#/freebies" data-page="freebies" data-tip="In-Kind Contributions">
        <span class="nav-icon">🤝</span><span class="nav-label">In-Kind Contributions</span>
      </a>
      <a class="nav-item" href="#/statements" data-page="statements" data-tip="Bank Statements">
        <span class="nav-icon">🏦</span><span class="nav-label">Bank Statements</span>
      </a>
    </div>
  </div>

  <div class="sidebar-section sidebar-bottom">
    <a class="nav-item" href="#/settings" data-page="settings" data-tip="Settings">
      <span class="nav-icon">⚙</span><span class="nav-label">Settings</span>
    </a>
  </div>

  <div class="sidebar-footer">v1.2.0</div>
</nav>

<!-- ─── Mobile top bar ──────────────────────────────────────────────────── -->
<div class="mobile-topbar" id="mobile-topbar">
  <button class="hamburger" id="hamburger" aria-label="Open menu">
    <span></span><span></span><span></span>
  </button>
  <div class="mobile-logo">
    <span class="logo-icon">◈</span>
    <span class="logo-text">Mellow Labs</span>
  </div>
</div>

<!-- ─── Sidebar overlay ──────────────────────────────────────────────────── -->
<div class="sidebar-overlay" id="sidebar-overlay"></div>

<!-- ─── Main ────────────────────────────────────────────────────────────── -->
<main class="main" id="main">
  <div class="page-content" id="page-content">
    <!-- Pages rendered here by JS router -->
    <div class="loading-state">
      <div class="spinner"></div>
      <p>Loading…</p>
    </div>
  </div>
</main>

<!-- Tooltip for the collapsed sidebar rail -->
<div id="nav-tip" class="nav-tip" role="presentation"></div>

<!-- Toast notifications -->
<div id="toast-container"></div>

<script type="module" src="/js/app.js"></script>
</body>
</html>
